<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Gefeliciteerd Milka! 70 Jaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="confetti"></div>
  <main>
    <section class="hero-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Flag_of_Suriname.svg" alt="Surinaamse vlag" class="flag">
      <h1>
        <span class="gold">Gefeliciteerd</span> <span class="name">Milka</span>
      </h1>
      <h2 class="subtitle">
        <span class="seventy">met je <span class="gold seventy-number">70<sup>ste</sup></span> verjaardag!</span>
      </h2>
      <div class="balloons">
        <img src="https://img.icons8.com/color/96/000000/balloon.png" alt="Ballon" />
        <img src="https://img.icons8.com/color/96/000000/balloon.png" alt="Ballon" />
        <img src="https://img.icons8.com/color/96/000000/balloon.png" alt="Ballon" />
      </div>
      <p class="message">
        Lieve Milka,<br>
        We wensen je een prachtige dag vol liefde, gezondheid en geluk.<br>
        Je bent een inspiratie voor iedereen om je heen.<br>
        <span class="gold">Fijne verjaardag!</span>
      </p>
      <div class="suriname-heart">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Flag_of_Suriname.svg" alt="Surinaamse vlag" />
        <span>Surinaamse trots</span>
      </div>
    </section>
    <footer>
      <span class="gold">Met liefde van je familie & vrienden</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
